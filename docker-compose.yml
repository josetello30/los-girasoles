# =============================================================================
# Club Residencial Los Girasoles de Huampaní - Infraestructura de contenedores
# Uso:   cp .env.example .env   &&   docker compose up -d
# Sprint 1: base de datos + Adminer.
# Sprint 2 agregará el backend (Node.js) y el Sprint 5 el dashboard (Streamlit).
# =============================================================================
name: los-girasoles

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16: única fuente de verdad del sistema
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: girasoles-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      # Roles de aplicación (los crea database/init/06_roles.sh)
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      DASHBOARD_DB_USER: ${DASHBOARD_DB_USER}
      DASHBOARD_DB_PASSWORD: ${DASHBOARD_DB_PASSWORD}
      TZ: America/Lima
      PGTZ: America/Lima
    command:
      - postgres
      - -c
      - timezone=America/Lima
      - -c
      - log_min_duration_statement=500   # registra consultas lentas (> 500 ms)
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Los scripts se ejecutan solo la PRIMERA vez (volumen vacío).
      # ':Z' re-etiqueta la carpeta para SELinux (obligatorio en Fedora).
      - ./database/init:/docker-entrypoint-initdb.d:ro,Z
      - ./database/tests:/pruebas:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Adminer: explorador web de la BD para el equipo (http://localhost:8080)
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:4
    container_name: girasoles-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Backend: API REST Node.js + Express (http://localhost:3000/api/v1)
  # Se conecta con el rol de mínimo privilegio, nunca como superusuario.
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      target: produccion
    image: girasoles-backend
    container_name: girasoles-backend
    restart: unless-stopped
    environment: &entorno-backend
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${APP_DB_USER}
      DB_PASSWORD: ${APP_DB_PASSWORD}
      JWT_SECRET: "${JWT_SECRET:?Define JWT_SECRET en .env - ejecuta make env}"
      JWT_EXPIRA: ${JWT_EXPIRA:-8h}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      RESERVA_PENDIENTE_MINUTOS: ${RESERVA_PENDIENTE_MINUTOS:-30}
      TZ: America/Lima
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Pruebas automáticas de la API (solo se ejecuta con: make test-api)
  # ---------------------------------------------------------------------------
  backend-pruebas:
    build:
      context: ./backend
      target: pruebas
    image: girasoles-backend-pruebas
    profiles: ["pruebas"]
    environment: *entorno-backend
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    name: girasoles-pgdata
