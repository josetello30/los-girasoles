; =============================================================================
; Garita de control de acceso - Club Residencial Los Girasoles de Huampaní
; ESP32 DevKit + RC522 + LCD 16x2 I2C + servo + LEDs + zumbador
;
; Compilar:  PlatformIO > Build  (o: pio run)
; Simular:   F1 > "Wokwi: Start Simulator" (usa el firmware de .pio/build/garita)
; =============================================================================

[platformio]
default_envs = garita

[env:garita]
; espressif32 6.x incluye el core Arduino-ESP32 2.0.17 (el que se usó para validar el código)
platform = espressif32 @ ^6.10.0
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Crea include/secretos.h desde el ejemplo si todavía no existe
extra_scripts = pre:scripts/crear_secretos.py

lib_deps =
    miguelbalboa/MFRC522 @ ^1.4.11
    bblanchon/ArduinoJson @ ^7.4.2
    madhephaestus/ESP32Servo @ ^3.0.6
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4

build_flags =
    -Wall
